name: container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # the image is only built when the source formats, builds, lints and tests
  # cleanly, with the hdf5 feature the image is built with
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install libhdf5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhdf5-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --features hdf5
        run: cargo build --locked --features hdf5

      - name: cargo clippy --features hdf5
        run: cargo clippy --locked --features hdf5 --all-targets -- -D warnings

      - name: cargo test --features hdf5
        run: cargo test --locked --features hdf5

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: build
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: Containerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: smoke test
        run: |
          podman run --rm ${{ env.IMAGE }}:sha-$(git rev-parse --short HEAD) --version
          podman run --rm ${{ env.IMAGE }}:sha-$(git rev-parse --short HEAD) validate /usr/share/s3vtest/examples/rgw-vstart.yaml /usr/share/s3vtest/examples/sift-128-euclidean.yaml

      - name: push
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v2
        with:
          tags: ${{ steps.meta.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
